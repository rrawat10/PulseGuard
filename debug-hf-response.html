<!DOCTYPE html>
<html>
<head>
    <title>Debug HF API Response</title>
</head>
<body>
    <h1>Testing Hugging Face API Direct Response</h1>
    <button onclick="testAPI()">Test HF API Directly</button>
    <pre id="output"></pre>

    <script>
        async function testAPI() {
            const output = document.getElementById('output');
            output.textContent = 'Testing...';
            
            // Generate 5000 random samples (simulating preprocessed ECG)
            const samples = Array.from({ length: 5000 }, () => Math.random());
            
            try {
                const response = await fetch('https://M0hit18-my-ecg-model.hf.space/predict_ecg', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        signal: samples,
                        timestamp: new Date().toISOString()
                    })
                });
                
                const data = await response.json();
                output.textContent = 'HF API Response:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
